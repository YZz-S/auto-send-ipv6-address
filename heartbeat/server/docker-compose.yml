version: '3'

services:
  heartbeat-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: heartbeat-server:latest
    container_name: heartbeat-server
    restart: unless-stopped
    ports:
      - "18080:8081"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    networks:
      - heartbeat-network

networks:
  heartbeat-network:
    driver: bridge 